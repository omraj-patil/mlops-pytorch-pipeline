apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: training-data-pvc
  namespace: ml-training
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: checkpoint-pvc
  namespace: ml-training
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: batch/v1
kind: Job
metadata:
  name: model-training
  namespace: ml-training
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: model-training
    spec:
      restartPolicy: Never

      containers:
        - name: trainer
          image: mlops-train:v1
          imagePullPolicy: Never

          env:
            - name: CONFIG_PATH
              value: /app/configs/training_config.yaml

          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 4Gi

          volumeMounts:
            - name: training-config
              mountPath: /app/configs
              readOnly: true

            - name: training-data
              mountPath: /app/data

            - name: checkpoints
              mountPath: /app/checkpoints

      volumes:
        - name: training-config
          configMap:
            name: training-config

        - name: training-data
          persistentVolumeClaim:
            claimName: training-data-pvc

        - name: checkpoints
          persistentVolumeClaim:
            claimName: checkpoint-pvc